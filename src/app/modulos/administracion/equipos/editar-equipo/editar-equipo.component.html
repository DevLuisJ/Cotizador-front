<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Creacion de Equipo</title>
  <link rel="stylesheet" type="text/css" href="./editar-equipo.component.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  
</head>
<body>
  <div class="fondo">
  <div class="pre-carga"  *ngIf="isLoading">
  <div class="preloader-wrapper big active">
    <div class="spinner-layer spinner-blue-only">
      <div class="circle-clipper left">
        <div class="circle"></div>
      </div><div class="gap-patch">
        <div class="circle"></div>
      </div><div class="circle-clipper right">
        <div class="circle"></div>
      </div>
    </div>
  </div>
 </div>
  
  <form [formGroup]= "fgValidador" (ngSubmit)="EditarEquipo()" class="form-register" *ngIf="!isLoading">
    
    <h4 style="text-align: center;">Edicion de Equipo</h4><br>
    <legend>Datos basicos</legend>
     <div class="Grupo-datosBasicos">
        <div class="row">
          <div class="col-4">
            <input formControlName="Referencia" class="controls" type="text" name="Referencia" id="Referencia"> 
            <label for="Referencia">Referencia</label>                      
          </div>
          <div class="col-8"> 
            <input formControlName="Descripcion"  class="controls" type="text" name="Descripcion" id="Descripcion" ><br>
            <label for="Descripcion" >Descripcion</label>    
                        
          </div>        
        </div>
        <div class="row">
          <div class="col">
            <input formControlName="Marca"  class="controls" type="text" name="Marca" id="Marca" >  
            <label for="Marca">Marca</label>                      
          </div>
          <div class="col">
            <input formControlName="PaisEquipo"  class="controls" type="text" name="PaisEquipo" id="PaisEquipo" >
            <label for="PaisEquipo" >Pais de origen</label>                        
          </div>
          <div class="col">
            <input formControlName="Proveedor" class="controls" type="text" name="Proveedor" id="Proveedor" >   
            <label for="Proveedor">Proveedor</label>                     
          </div>
        </div>
        <div class="row" >   
          <div class="col">            
            <select formControlName="Arancel" class="form-select">
                <option value="0">0</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="Courrier">Courrier</option> 
            </select>
             <label for="Arancel">Arancel</label> 
          </div>         
            <div class="col">
              <input formControlName="PosArancelaria" class="controls" type="text" name="PosArancelaria" id="PosArancelaria" >
              <label for="PosArancelaria">Posicion Arancelaria</label>              
            </div>     
            <div class="col">               
               <select formControlName="esApilable" class="form-select">
                 <option value="SI">SI</option>
                 <option value="NO">NO</option>                     
               </select>
               <label for="esApilable">Es apilable?</label>                   
            </div>            
          </div>

      </div>
      <legend>Dimensiones y peso</legend>
    <div class="Grupo-datosBasicos">
      <div class="row">
        <div class="col">
          <input formControlName="Anchura" class="controls" type="number" name="Anchura" id="Anchura" >
          <label for="Anchura">Ancho</label>                 
        </div>
        <div class="col">
          <input formControlName="Altura" class="controls" type="number" name="Altura" id="Altura" >
          <label for="Altura">Altura</label>          
        </div>
        <div class="col">
          <input formControlName="Profundidad" class="controls" type="number" name="Profundidad" id="Profundidad" >
          <label for="Profundidad">Profundidad</label>          
        </div>
        <div class="col-4">
          <input formControlName="PesoReal" class="controls" type="number" name="PesoReal" id="PesoReal" >
           <label for="PesoReal" style="text-align: left;">Peso Real</label>           
        </div>
      </div>
    </div> 
<br>
<br>
    <button [disabled]="!fgValidador.valid" class="btn btn-primary" type="submit"> EDITAR EQUIPO</button>    
  </form> 
</div> 
</body>
</html>
