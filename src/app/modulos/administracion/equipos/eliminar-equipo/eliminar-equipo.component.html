
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Creacion de Equipo</title>
  
  <link rel="stylesheet" type="text/css" href="./eliminar-equipo.component.css">
  

</head>
<body>
    <div class="pre-carga"  *ngIf="isLoading">
        <div class="preloader-wrapper big active">
          <div class="spinner-layer spinner-blue-only">
            <div class="circle-clipper left">
              <div class="circle"></div>
            </div><div class="gap-patch">
              <div class="circle"></div>
            </div><div class="circle-clipper right">
              <div class="circle"></div>
            </div>
          </div>
        </div>
       </div>
<form (ngSubmit)="Eliminar()" class="form-register">
<div class="container">
    <p>Esta usted seguro de eliminar el siguiente equipo? :</p>
    <br />
    <div class="row">
        <div class="col">
            <label for="Referencia">Referencia</label>
        </div>
        <div>
            <p>{{equipo.Referencia}}</p>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <label for="Descripcion">Descripcion</label>
        </div>
        <div>
            <p>{{equipo.Descripcion}}</p>
        </div>
    </div>
    
    <br />
    <div class="row" style="margin-left: 90px;">
        <div class="col">
            <button (click)= "Eliminar()" class="btn red ">si</button>
        </div>
        <div class="col">
          <button routerLink="../../buscar-equipo" class="btn ">no</button>  
        </div>
    
    
    </div>
</div>
</form>
</body>
</html>
