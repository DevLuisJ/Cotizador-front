<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Listado Usuarios</title>
</head>
<body>
    
    <div *ngIf="isLoading" class="pre-carga">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div> 
<legend style="text-align: center;">Listado de Usuarios</legend>
    <table *ngIf="!isLoading" class="table table-success table-bordered">
        
        <thead style="text-align: center;">
            <tr>
                <th>Cedula</th>
                <th>Nombres</th>
                <th>Apellidos</th>
                <th>Cargo</th>
                <th>Correo</th>
                <th>Editar</th>
                <th>Eliminar</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let u of listadoUsuarios" class="align-middle">
                <td>{{u.cedula}}</td>
                <td>{{u.nombre}}</td>
                <td>{{u.apellidos}}</td>
                <td>{{u.cargo}}</td>
                <td>{{u.email}}</td>
                <td>
                    <a routerLink="/administracion/editar-usuario/{{u.id}}" class="btn btn-success">Editar</a>
                </td>
                <td>
                    <a routerLink="/administracion/eliminar-usuario/{{u.id}}" class="btn btn-danger">Eliminar</a>
                    
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
