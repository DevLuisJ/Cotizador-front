<!DOCTYPE html>
<html lang="en">

<head >
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge"> 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> 
  
  <title>Editar Usuario</title>
</head>
<body>

    <div class="pre-carga"  *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
     </div>
     
  <form  [formGroup]= "fgValidador" (ngSubmit)="EditarUsuario()" class="form-register">
  
    <h4 style="text-align: center;">Editar Usuario</h4><br>
    <div class="row">
        <div class="col">
          <input formControlName="cedula" class="form-control" type="text" name="cedula" id="cedula" placeholder="No. cedula">
        </div>
        <div class="col">
          <input formControlName="email" class="form-control" type="email" name="email" id="email" placeholder="Correo">
        </div>
    </div><br>
    <div class="row">
      <div class="col">
        <input formControlName="nombre" class="form-control" type="text" name="nombre" id="nombre" placeholder="Nombres">
      </div>
      <div class="col">
        <input formControlName="apellidos" class="form-control" type="text" name="apellidos" id="apellidos" placeholder="Apellidos">
      </div>
    </div><br>  
    
    <select formControlName="cargo" class="form-select"  placeholder="Cargo">
        <option value="" disabled selected>Selecciona un cargo</option>
        <option value="Administrador">Administrador</option>
        <option value="Asesor">Asesor</option>
        <option value="Asistente Administrativo">Asistente Administrativo</option>        
    </select><br>
    
   
    <button [disabled]="!fgValidador.valid" class="btn btn-primary" type="submit"> EDITAR USUARIO</button>
    
  </form>
