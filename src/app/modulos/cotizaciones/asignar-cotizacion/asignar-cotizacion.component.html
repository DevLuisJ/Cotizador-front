<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="./asignar-cotizacion.component.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <title>Cotizar</title>
</head>
<body>
    <div *ngIf="isLoading" class="mensaje-espera">
        <h3>Cargando...</h3>
    </div> 
    <form (ngSubmit)="buscarEquipoPorReferencia()">
        <input type="text" style="color: aliceblue;" name="equipoBuscado" placeholder="Buscar equipo por Referencia" [(ngModel)]="equipoBuscado">
        <button class="btn waves-effect waves-light" type="submit" name="action">Buscar
            <i class="material-icons right">send</i>
        </button>
    </form>

            <div *ngIf="selectedItem" class="enclosure">
            <label><i><b>Datos del equipo seleccionado</b></i></label>
            <br>
            <p>Referencia: {{ selectedItem.Referencia }}</p>
            <p>Descripción: {{ selectedItem.Descripcion }}</p>                    
        </div>
        <form [formGroup]= "fgValidador" (ngSubmit)="GuardarCotizacion()"class="form-register" >
            
                    <input formControlName="Cantidad" class="controls" type="number" name="Cantidad" id="Cantidad" >
                    <label for="Cantidad">Cantidad</label>
                    <br>
                    <br>
                    <input formControlName="Fecha" class="controls" type="date" name="Fecha" id="Fecha" >
                    <label for="Fecha">Fecha</label>
                    <br>
                    <br>
                    <input formControlName="IdSiigo" class="controls" type="text" name="IdSiigo" id="IdSiigo" >
                    <label for="IdSiigo">Consecutivo Siigo No.</label>
                    <br>
                    <br>     
                    <input formControlName="Cliente" class="controls" type="text" name="Cliente" id="Cliente" >
                    <label for="Cliente">Cliente</label>
                    <br>
                    <br>
                    <input formControlName="PrecioCompra" class="controls" type="number" name="PrecioCompra" id="PrecioCompra" >
                    <label for="PrecioCompra">Precio de compra</label>
                    <br>
                    <br>
                    <input formControlName="Moneda" class="controls" list="datalistOptions" type="text" name="Moneda" id="Moneda" >
                    <datalist id="datalistOptions">
                    <option value="USD">
                    <option value="EUR">
                    <option value="SEK">                  
                    </datalist>
                    <label for="Moneda">Moneda</label>
                    
                    <br>
                    <br>
    
            
        
                <button [disabled]="!fgValidador.valid" class="btn btn-primary" type="submit">Agregar</button>          
        </form>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script> 
</body>

</html>
