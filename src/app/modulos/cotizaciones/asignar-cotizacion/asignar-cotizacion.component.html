<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
       
    <title>Cotizar</title>
</head>
<body>
    <div class="pre-carga"  *ngIf="isLoading">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
    </div>
    
       <div class="container">
      <h2 class="text-center mt-5">Cotizacion de Equipo</h2>      
                <form class="form-buscar" (ngSubmit)="buscarEquipoPorReferencia()">                  
                    <div class="mb-3">
                        <input class= "my-2 form-control" type="text" name="equipoBuscado" placeholder="Digite la referencia" [(ngModel)]="equipoBuscado">
                        <label class="form-label" for="equipoBuscado"> Referencia</label><br>
                    </div>
                   <div *ngIf="equipoEncontrado && mostrarFormulario">                        
                        <output style="border: solid 1px white; padding: 10px;">{{ equipoEncontrado.Descripcion }}</output><br>
                         <label class="form-label">Descripcion</label>                                    
                    </div>
                    <button class="btn btn-primary my-3" type="submit" name="action">Buscar</button>
                      <form class="form-register"*ngIf="equipoEncontrado && mostrarFormulario" [formGroup]= "fgValidador" (ngSubmit)="GuardarCotizacion()" >
            
            <div class="row row-cols-lg-auto g-3 align-items-center">
                <div class="col-8">
                    <input formControlName="Cliente" class="form-control" type="text" name="Cliente" id="Cliente" >
                    <label for="Cliente">Cliente</label>
                </div>
                <div class="col-4">
                    <input formControlName="IdSiigo" class="form-control" type="text" name="IdSiigo" id="IdSiigo" placeholder="Digite el consecutivo de Siigo" >
                    <label for="IdSiigo">Siigo No.</label>
                </div> 
                
            </div>
                    <div class="row">
                        <div class="col mb-3">
                          <input formControlName="Cantidad" class="form-control" type="number" name="Cantidad" id="Cantidad" >
                    <label for="Cantidad">Cantidad</label>                              
                        </div>
                            
                        <div class="col mb-3">
                            <input formControlName="PrecioCompra" class="form-control"type="number">                                                            
                            <label for="PrecioCompra" class="form-label">Precio de compra</label>
                        </div> 
                        <div class="col mb-3">
                            <select formControlName="Moneda" class="form-select">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="SEK">SEK</option>
                              </select>
                            <label for="Moneda">Moneda</label>
                        </div> 
                    </div>
                    <div class="row">
                        
                        <div class="col mb-3">   
                            <input formControlName="FleteOrigenDestino" class="form-control" type="number" name="FleteOrigenDestino" id="FleteOrigenDestino" step="any">
                            <label for="FleteOrigenDestino">Flete Origen-Destino</label>                            
                        </div>
                        <div class="col mb-3">   
                            <input formControlName="CargoCombustible" class="form-control" name="CargoCombustible" id="CargoCombustible" type="number" step="any"/>%
                            <label for="CargoCombustible">Cargos de Combustible</label>                            
                        </div>
                        <div class="col mb-3">   
                            <input formControlName="AlistamientoProveedor" class="form-control" name="AlistamientoProveedor" id="AlistamientoProveedor" type="number" step="any"/>
                            <label for="AlistamientoProveedor">Alistamiento Proveedor</label>                            
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <input formControlName="TasaCambio" class="form-control" name="TasaCambio" id="TasaCambio" type="number" step="any"/>
                            <label for="TasaCambio">Tasa de cambio</label> 
                        </div>
                        <div class="col mb-3">
                            <input formControlName="FleteLocal" class="form-control" name="FleteLocal" id="FleteLocal" type="number" step="any"/>
                            <label for="FleteLocal">Flete Local</label> 
                        </div>
                        <div class="col mb-3">
                            <input formControlName="AccesoriosLocales" class="form-control" name="AccesoriosLocales" id="AccesoriosLocales" type="number" step="any"/>
                            <label for="AccesoriosLocales">Accesorios Locales</label> 
                        </div>

                    </div> 
                    <div class="row">
                        <div class="col-4 mb-3">
                            <select formControlName="FormaPago" class="form-select" type="number" step="any">                                
                                <option value=3>3%</option>
                                <option value=6>6%</option>
                                <option value=9>9%</option>
                                <option value=12>12%</option>
                            </select>
                            <label for="FormaPago">Forma de pago</label>         
                       </div>
                        
                        <div class="col-4 mb-3">
                            <input formControlName="PuestaMarcha" class="form-control" name="PuestaMarcha" id="PuestaMarcha" type="number" step="any"/>
                              <label for="PuestaMarcha">Puesta en Marcha</label>
                            <!--button id="BtnPuestaMarcha" (click)="toggleSegundoFormulario()" type="button" class="btn btn-info">Puesta en Marcha</button-->
                        </div>
                           
                    </div>  
                    <div class="row">
                        <div class="col mb-3">
                            <input formControlName="Observaciones" class="form-control" name="Observaciones" id="Observaciones" type="text" />
                            <label for="Observaciones">Observaciones</label>    
                        </div>

                    </div>  
        <div class="row">
            <!--div class="col">
                <button [disabled]="!fgValidador.valid" class="btn btn-primary mb-3" type="submit" 
                    data-bs-toggle="modal" data-bs-target="#resultadoModal">Agregar</button-->  
           
            <div class="col">
                <button [disabled]="!fgValidador.valid" class="btn btn-primary mb-3" type="submit">Agregar</button>  
            </div>
            <div class="col">
                <button class="btn btn-primary mb-3" type="button" data-bs-toggle="modal" data-bs-target="#resultadoModal">Mostrar Resultados</button>
            </div>
            
            <!--div class="col">
                <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#resultadoModal">Mostrar Resultados</button>

            </div-->
        </div>       
                
        </form>  
    </form> 
</div>

    <div class="modal-dialog">

        <div class="modal-header">

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
