<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
       
    <title>Cotizar</title>
</head>
<body>
    <div class="pre-carga"  *ngIf="isLoading">
        <div class="preloader-wrapper big active">
          <div class="spinner-layer spinner-blue-only">
            <div class="circle-clipper left">
              <div class="circle"></div>
            </div><div class="gap-patch">
              <div class="circle"></div>
            </div><div class="circle-clipper right">
              <div class="circle"></div>
            </div>
          </div>
        </div>
       </div>
       <h2 style="text-align: center;">Cotizacion de Equipo</h2>
       <div class="row" >
            <div class="col-1"></div>
            <div class="col-3"><br>
                <form class="form-buscar" (ngSubmit)="buscarEquipoPorReferencia()">
                    <input class= "my-2" type="text" name="equipoBuscado" placeholder="Digite la referencia" [(ngModel)]="equipoBuscado"><br>
                    <button class="btn btn-primary my-3" type="submit" name="action">Buscar</button>
        
                </form> 

            </div>
            <div class="col-5">
                <div *ngIf="equipoEncontrado" class="enclosure">
                    <label><i><b>Datos del equipo a cotizar</b></i></label>
                    <br>
                    <label style="margin-right: 10px;">Referencia:   </label>
                    <output>{{ equipoEncontrado.Referencia }}</output><br>
                    <label>Descripcion: </label>
                    <output>{{ equipoEncontrado.Descripcion }}</output>                                      
                </div>
            </div>        
        </div>
        <form class="form-register"*ngIf="equipoEncontrado && !puestaMarchaFormulario" [formGroup]= "fgValidador" (ngSubmit)="GuardarCotizacion()" >
            
            <div class="row">
                <div class="col mb-3">
                    <input formControlName="Cliente" class="controls" type="text" name="Cliente" id="Cliente" >
                    <label for="Cliente">Cliente</label>
                </div>
                <div class="col mb-3">
                    <input formControlName="IdSiigo" class="controls" type="text" name="IdSiigo" id="IdSiigo" placeholder="Digite el consecutivo de Siigo" >
                    <label for="IdSiigo">Siigo No.</label>
                </div> 
                <div class="col mb-3" >
                    <input formControlName="Fecha" class="controls" type="date" name="Fecha" id="Fecha" >
                    <label for="Fecha">Fecha</label>

                </div>
            </div>
                    <div class="row">
                        <div class="col mb-3">
                          <input formControlName="Cantidad" class="controls" type="number" name="Cantidad" id="Cantidad" >
                    <label for="Cantidad">Cantidad</label>                              
                        </div>
                            
                        <div class="col mb-3">
                            <input formControlName="PrecioCompra" class="controls" type="number" name="PrecioCompra" id="PrecioCompra" step="any">
                            <label for="PrecioCompra">Precio de compra</label>
                        </div> 
                        <div class="col mb-3">
                            <select formControlName="Moneda" class="form-select">
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                                <option value="SEK">SEK</option>
                              </select>
                            <label for="Moneda">Moneda</label>
                        </div> 
                    </div>
                    <div class="row">
                        
                        <div class="col mb-3">   
                            <input formControlName="FleteOrigenDestino" class="controls" type="number" name="FleteOrigenDestino" id="FleteOrigenDestino" step="any">
                            <label for="FleteOrigenDestino">Flete Origen-Destino</label>                            
                        </div>
                        <div class="col mb-3">   
                            <input formControlName="CargoCombustible" class="controls" name="CargoCombustible" id="CargoCombustible" type="number" step="any"/>%
                            <label for="CargoCombustible">Cargos de Combustible</label>                            
                        </div>
                        <div class="col mb-3">   
                            <input formControlName="AlistamientoProveedor" class="controls" name="AlistamientoProveedor" id="AlistamientoProveedor" type="number" step="any"/>
                            <label for="AlistamientoProveedor">Alistamiento Proveedor</label>                            
                        </div>
                    </div>
                    <div class="row">
                        <div class="col mb-3">
                            <input formControlName="TasaCambio" class="controls" name="TasaCambio" id="TasaCambio" type="number" step="any"/>
                            <label for="TasaCambio">Tasa de cambio</label> 
                        </div>
                        <div class="col mb-3">
                            <input formControlName="FleteLocal" class="controls" name="FleteLocal" id="FleteLocal" type="number" step="any"/>
                            <label for="FleteLocal">Flete Local</label> 
                        </div>
                        <div class="col mb-3">
                            <input formControlName="AccesoriosLocales" class="controls" name="AccesoriosLocales" id="AccesoriosLocales" type="number" step="any"/>
                            <label for="AccesoriosLocales">Accesorios Locales</label> 
                        </div>

                    </div> 
                    <div class="row">
                        <div class="col-4 mb-3">
                            <select formControlName="FormaPago" class="form-select" type="number" step="any">                                
                                <option value=3>3%</option>
                                <option value=6>6%</option>
                                <option value=9>9%</option>
                                <option value=12>12%</option>
                            </select>
                            <label for="FormaPago">Forma de pago</label>         
                       </div>
                        
                        <div class="col-4 mb-3">
                            <input formControlName="PuestaMarcha" class="controls" name="PuestaMarcha" id="PuestaMarcha" type="number" step="any"/>
                              <label for="PuestaMarcha">Puesta en Marcha</label>
                            <!--button id="BtnPuestaMarcha" (click)="toggleSegundoFormulario()" type="button" class="btn btn-info">Puesta en Marcha</button-->
                        </div>
                           
                    </div>  
                    <div class="row">
                        <div class="col mb-3">
                            <input formControlName="Observaciones" class="controls" name="Observaciones" id="Observaciones" type="text" />
                            <label for="Observaciones">Observaciones</label>    
                        </div>

                    </div>  
        
                <button [disabled]="!fgValidador.valid" class="btn btn-primary mb-3" type="submit">Agregar</button>  
                
                
        </form>
        <form *ngIf="puestaMarchaFormulario" [formGroup]="puestaMarchaFormGroup" (ngSubmit)="PuestaEnMarcha()" class="formPuestaMarcha">

            <button type="submit" class="btn btn-success">Success</button>

</html>
