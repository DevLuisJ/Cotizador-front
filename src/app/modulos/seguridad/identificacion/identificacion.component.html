

<!DOCTYPE html>
<html lang="en">

<head >
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">  
  <link rel="stylesheet" type="text/css" href="/assets/css/styleForms.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <title>Login</title>
</head>
<body>
  <div *ngIf="isLoading" class="pre-carga">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>         
</div>
  <form  [formGroup]= "fgValidador" (ngSubmit)="identificarUsuario()" class="form-register">
    <h4>Ingresa tus datos</h4><br>
    <input formControlName="usuario" class="form-control" type="text" name="usuario" id="usuario" placeholder="Digite su correo"><br>
    <input formControlName="clave" class="form-control" type="password" name="clave" id="clave" placeholder="Digite la contraseña"><br>
    <button [disabled]="!fgValidador.valid" class="btn btn-primary" type="submit"> Enviar</button>
  </form>

  
</body>

</html>
